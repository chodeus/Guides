name: Media Player Test Report
description: Add your test results for a media player to the Tested Media Players table.
title: "[Media Player] "
labels: ["Type: Media Player Report"]
body:
  - type: markdown
    attributes:
      value: "Use this form to add your results to the [Tested Media Players](https://chodeus.github.io/Guides/tested-media-players-preview.html) table.\n\n- Post your test in the [TRaSH Guides Discord](https://trash-guides.info/discord) first. The form asks for the thread link so people can discuss your results.\n- Set a result only for the formats you tested. Anything left on **Not tested** stays blank in the table.\n- A note becomes the text people see when they hover that result in the table.\n- After you submit, a pull request with your results opens automatically. If something needs fixing, edit this issue and the pull request updates."
  - type: input
    id: device
    attributes:
      label: "Device"
      description: "The hardware you tested on, for example SHIELD Android TV (2019) (Pro) or LG OLED65CX6LA. To add results to an existing row, copy its spelling from the table."
    validations:
      required: true
  - type: textarea
    id: device_comment
    attributes:
      label: "Device comment"
      description: "Optional. Anything about the device itself, such as its firmware version. Shown when someone hovers the device name."
  - type: input
    id: player
    attributes:
      label: "Player/Product"
      description: "The app you played with, for example Plex for Android (TV) or Infuse. For a Kodi add-on, write Kodi (add-on), for example Kodi (PM4K)."
    validations:
      required: true
  - type: textarea
    id: player_comment
    attributes:
      label: "Player/Product comment"
      description: "Optional. Anything about the app, such as its version or settings. Shown when someone hovers the app name."
  - type: input
    id: discord_thread
    attributes:
      label: "Discord thread"
      description: "Post your test in the [TRaSH Guides Discord](https://trash-guides.info/discord), in #request-suggestions with a title starting with `Test Media Player <your device>`. Paste the thread link here so people can discuss the results."
      placeholder: "https://discord.com/channels/..."
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Dolby Vision and HDR\n\nEach format has a result and an optional note."
  - type: dropdown
    id: dv_p5
    attributes:
      label: "DV P5"
      description: "DV Profile 5. This is what comes with WEB-DL Dolby Vision releases without HDR10 fallback. (Incompatible devices will playback with blown out pinks and greens)"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dv_p5_note
    attributes:
      label: "DV P5 note"
      placeholder: "Optional"
  - type: dropdown
    id: dv_p7
    attributes:
      label: "DV P7"
      description: "DV Profile 7. This is what comes with UHD Bluray Remuxes and UHD BluRay releases. These files will play on an Nvidia Shield Pro (2019), but on most other players will revert to the HDR10 fallback."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dv_p7_note
    attributes:
      label: "DV P7 note"
      placeholder: "Optional"
  - type: dropdown
    id: dv_p8
    attributes:
      label: "DV P8"
      description: "DV Profile 8. This is what comes with (Hybrid) WEB-DL (HULU), Hybrid UHD Remux, and UHD BluRay releases (all of which have HDR10 fallback). This works with several mainstream media players."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dv_p8_note
    attributes:
      label: "DV P8 note"
      placeholder: "Optional"
  - type: dropdown
    id: fel
    attributes:
      label: "FEL"
      description: "DV Profile 7 with a Full Enhancement Layer. Found on many UHD BluRay Remuxes. Players that play DV P7 without FEL support ignore the enhancement layer and play the base layer with the DV metadata. Some DV P8 releases have the FEL baked into the video, those play as normal DV P8 and don't need FEL support."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: fel_note
    attributes:
      label: "FEL note"
      placeholder: "Optional"
  - type: dropdown
    id: mel
    attributes:
      label: "MEL"
      description: "DV Profile 7 with a Minimal Enhancement Layer. The enhancement layer is empty, so the picture is the same as DV Profile 8."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: mel_note
    attributes:
      label: "MEL note"
      placeholder: "Optional"
  - type: dropdown
    id: hdr10
    attributes:
      label: "HDR10"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: hdr10_note
    attributes:
      label: "HDR10 note"
      placeholder: "Optional"
  - type: dropdown
    id: hdr10_plus
    attributes:
      label: "HDR10+"
      description: "HDR10+ content backward compatible with non-HDR10+ TVs/Devices. HDR10+ metadata is ignored by devices that do not support the format and video is played back in HDR10."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: hdr10_plus_note
    attributes:
      label: "HDR10+ note"
      placeholder: "Optional"
  - type: markdown
    attributes:
      value: "## Audio"
  - type: dropdown
    id: truehd_atmos
    attributes:
      label: "TrueHD ATMOS"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: truehd_atmos_note
    attributes:
      label: "TrueHD ATMOS note"
      placeholder: "Optional"
  - type: dropdown
    id: dts_x
    attributes:
      label: "DTS X"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dts_x_note
    attributes:
      label: "DTS X note"
      placeholder: "Optional"
  - type: dropdown
    id: dd_plus_atmos
    attributes:
      label: "DD+ ATMOS"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dd_plus_atmos_note
    attributes:
      label: "DD+ ATMOS note"
      placeholder: "Optional"
  - type: dropdown
    id: truehd
    attributes:
      label: "TrueHD"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: truehd_note
    attributes:
      label: "TrueHD note"
      placeholder: "Optional"
  - type: dropdown
    id: dts_hd_ma
    attributes:
      label: "DTS-HD MA"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dts_hd_ma_note
    attributes:
      label: "DTS-HD MA note"
      placeholder: "Optional"
  - type: dropdown
    id: flac_pcm
    attributes:
      label: "FLAC/PCM"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: flac_pcm_note
    attributes:
      label: "FLAC/PCM note"
      placeholder: "Optional"
  - type: dropdown
    id: dd_plus_eac3
    attributes:
      label: "DD+/E-AC3"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dd_plus_eac3_note
    attributes:
      label: "DD+/E-AC3 note"
      placeholder: "Optional"
  - type: dropdown
    id: dts
    attributes:
      label: "DTS"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dts_note
    attributes:
      label: "DTS note"
      placeholder: "Optional"
  - type: dropdown
    id: aac
    attributes:
      label: "AAC"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: aac_note
    attributes:
      label: "AAC note"
      placeholder: "Optional"
  - type: dropdown
    id: dd_ac3
    attributes:
      label: "DD/AC3"
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: dd_ac3_note
    attributes:
      label: "DD/AC3 note"
      placeholder: "Optional"
  - type: markdown
    attributes:
      value: "## Video and subtitles"
  - type: dropdown
    id: hi10
    attributes:
      label: "Hi10"
      description: "H.264 (AVC) High 10 profile, also called Hi10P. 10-bit H.264, common in older anime releases. Most hardware decoders can't play it, so it needs software decoding or a transcode."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: hi10_note
    attributes:
      label: "Hi10 note"
      placeholder: "Optional"
  - type: dropdown
    id: ass_ssa
    attributes:
      label: "ASS/SSA"
      description: "Advanced SubStation Alpha / SubStation Alpha subtitles, common in anime releases. Styled subtitles with fonts, colors and positioning. If the player can't render them, Plex burns them into the video, which forces a video transcode."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: ass_ssa_note
    attributes:
      label: "ASS/SSA note"
      placeholder: "Optional"
  - type: dropdown
    id: pgs
    attributes:
      label: "PGS"
      description: "Presentation Graphic Stream subtitles, found on Blu-ray and UHD BluRay releases. Image-based, so the player can't restyle them. If the player can't render them, Plex burns them into the video, which forces a video transcode."
      options: ["Not tested", "✅ Yes", "❌ No"]
      default: 0
  - type: input
    id: pgs_note
    attributes:
      label: "PGS note"
      placeholder: "Optional"
  - type: markdown
    attributes:
      value: "## Screenshots and credit"
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. Tautulli during playback, plus what your TV shows for video formats or what your AVR shows for audio formats."
    validations:
      accept: ".png,.jpg,.jpeg,.gif,.webp"
  - type: input
    id: tested_by
    attributes:
      label: "Tested by"
      description: "Optional. The name to credit, for example your Discord name. Blank uses your GitHub name."
  - type: input
    id: test_date
    attributes:
      label: "Date of test"
      description: "Optional. Blank uses the month you open this issue."
      placeholder: "November 2026"
  - type: input
    id: tv_avr
    attributes:
      label: "TV / AVR used"
      description: "Optional. The TV and AVR you tested with. Results like Dolby Vision only show if the TV supports them."
      placeholder: "LG C2 + Denon X3800H"
  - type: checkboxes
    id: ai-disclosure
    attributes:
      label: AI disclosure
      description: Check this box if AI was used to create this issue.
      options:
        - label: This issue was created with AI assistance.
          required: false
